<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثروة | رادار الفرص</title><style> *{box-sizing:border-box}body{margin:0;background:#02070c;color:#cfeefc;font:15px system-ui,sans-serif;line-height:1.7}main{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:8px 0}p{color:#95adbd}a{color:#4fd8ff}button,input,select{font:inherit;background:#0b1a25;color:#cfeefc;border:1px solid #295164;border-radius:8px;padding:8px 12px}button{cursor:pointer}button[aria-pressed=true]{border-color:#4fd8ff;color:#4fd8ff}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.filters input{flex:1;min-width:140px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:12px}article{background:#081520;border:1px solid #203b4b;border-radius:12px;padding:16px;overflow-wrap:anywhere}h2{font-size:19px;margin:0}small{color:#95adbd}dl{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:12px 0}dt{color:#95adbd}dd{margin:0}#status{color:#4fd8ff}summary{cursor:pointer}footer{margin:24px 0;color:#95adbd}</style><main><header><div><small>O.db / BOTTLENECK INVESTING</small><h1>رادار الفرص الاستثمارية</h1></div><a href="./index.html" target="_top">العودة إلى ثروة</a></header><p>شركات تحل اختناقات حقيقية عبر قطاعات مستقلة — متابعة بحثية وليست توصيات شراء.</p><div id="status" role="status">جاري تحميل الرادار…</div><p id="note"></p><div class="filters"><button data-type="all" aria-pressed="true">الكل</button><button data-type="private" aria-pressed="false">شركات خاصة</button><button data-type="listed" aria-pressed="false">شركات مدرجة</button><input id="q" placeholder="ابحث باسم الشركة أو القطاع" aria-label="البحث"><select id="sector" aria-label="القطاع"><option value="">كل القطاعات</option></select><button id="refresh">تحديث العرض</button></div><p id="count"></p><section id="cards" class="cards"></section><h2 style="margin-top:24px">سجل التحديثات</h2><section id="history"></section><footer>بيانات عامة فقط؛ لا تُخزن هنا معلومات المحفظة أو الحساب. التوافق الشرعي وإمكانية الشراء يحتاجان تحققًا مستقلًا.</footer></main><script>const $=id=>document.getElementById(id);let data=null,type='all';function el(tag,t){const e=document.createElement(tag);if(t!=null)e.textContent=t;return e}function link(url){try{const u=new URL(url);if(u.protocol!=='https:')return null;const a=el('a','المصدر');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a}catch{return null}}function render(){if(!data)return;const list=data.companies.filter(c=>(type==='all'||c.type===type)&&(!$('sector').value||c.sector===$('sector').value)&&[c.name,c.ticker,c.sector].join(' ').toLowerCase().includes($('q').value.toLowerCase()));$('count').textContent=list.length+' شركة من '+data.companies.length;$('cards').replaceChildren();for(const c of list){const a=el('article');a.append(el('small',c.type==='listed'?'مدرجة':'خاصة'),el('h2',c.name),el('p',c.sector));const dl=el('dl');for(const [k,v] of [['المرحلة',c.stage],['التقييم / القيمة السوقية',Number.isFinite(c.valuationUsd)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:'compact'}).format(c.valuationUsd):null],['الرمز والسوق',[c.ticker,c.exchange].filter(Boolean).join(' / ')],['التوافق الشرعي',c.sharia],['إمكانية الاستثمار',c.access],['المخاطر',c.risk],['تاريخ المعلومة',c.date]]){dl.append(el('dt',k),el('dd',v||'غير متحقق'))}a.append(dl,el('p',c.update));const l=link(c.source);if(l)a.append(l);$('cards').append(a)}if(!list.length)$('cards').append(el('p','لا توجد نتائج متحققة لهذا الفلتر بعد.'));}async function load(){try{const r=await fetch('./bottleneck-data.json',{cache:'no-store'});if(!r.ok)throw Error();const next=await r.json();if(!Array.isArray(next.companies))throw Error();data=next;$('status').textContent='آخر تحديث للبيانات: '+data.updated;$('note').textContent=data.note||'';const s=$('sector'),old=s.value;s.replaceChildren(new Option('كل القطاعات',''));for(const x of [...new Set(data.companies.map(c=>c.sector))].sort())s.add(new Option(x,x));s.value=old;$('history').replaceChildren();for(const h of (data.history||[]).slice().reverse()){const p=el('article');p.append(el('small',h.date),el('p',h.summary));$('history').append(p)}if(!data.history?.length)$('history').append(el('p','لا توجد تحديثات يومية مسجلة بعد.'));render()}catch{$('status').textContent='تعذر تحميل أحدث البيانات؛ حاول مرة أخرى.'}}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});$('q').oninput=render;$('sector').onchange=render;$('refresh').onclick=load;load();</script></html>
